name: Prototype CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: node --check public/app.js && node --check public/game.js && node --check "functions/api/[[path]].js"
      - name: Validate required assets and routes
        run: |
          test -s public/index.html
          test -s public/styles.css
          test -s public/app.js
          grep -q 'SHOWOFF' public/index.html
          grep -q 'aria-live="polite"' public/index.html
          grep -q 'DEMO' public/index.html
