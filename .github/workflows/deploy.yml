name: Deploy to Cloudflare Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: chk
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_URL SUPABASE_ANON_KEY; do
            [ -n "${!v}" ] || { echo "::warning::Secret $v is not set; skipping deploy. See DEPLOYMENT.md"; echo ok=false >> $GITHUB_OUTPUT; exit 0; }
          done
          echo ok=true >> $GITHUB_OUTPUT
      - name: Inject public Supabase settings
        if: steps.chk.outputs.ok == 'true'
        run: |
          printf '\n[vars]\nSUPABASE_URL = "%s"\nSUPABASE_ANON_KEY = "%s"\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" >> wrangler.toml
          printf "window.SHOWOFF_CFG={supabaseUrl:'%s',anonKey:'%s'};\n" "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > public/config.js
      - name: Create project (first run only) and deploy
        if: steps.chk.outputs.ok == 'true'
        run: |
          npx --yes wrangler@4 pages project create showoff --production-branch=main || true
          npx --yes wrangler@4 pages deploy public --project-name=showoff --branch=main
